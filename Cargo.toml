[workspace]
resolver = "2"
members = ["micro-core", "micro-app"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["Micro rewrite"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
