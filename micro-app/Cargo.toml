[package]
name = "micro-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Micro — симулятор микропрограммируемого процессора (GUI на egui)"

[[bin]]
name = "micro"
path = "src/main.rs"

[dependencies]
micro-core = { path = "../micro-core" }
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }
egui = "0.37"
egui_extras = "0.37"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = "6"

[package.metadata.notes]
renderer = "glow (без WebView/Chromium)"
